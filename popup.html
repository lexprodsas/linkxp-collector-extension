<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="icons/icon48.png" alt="LinkXP" class="logo">
            <h1>LinkXP Stats</h1>
        </div>

        <!-- Section Authentification API -->
        <div class="section">
            <h3>🔗 Liaison Compte LinkXP</h3>
            <div id="authStatus" class="auth-status not-linked">🔴 Compte non lié</div>

            <div class="button-group">
                <button id="linkAccountBtn" class="btn btn-primary">
                    Lier au compte LinkXP
                </button>
            </div>
        </div>

        <!-- Section Collecte -->
        <div class="section">
            <h3>Collecte de données</h3>
            <div class="button-group">
                <button id="getPublicationsBtn" class="btn btn-primary">Collecter mes publications</button>
                <button id="getSkillsBtn" class="btn btn-primary">Collecter mes compétences</button>
            </div>
        </div>

        <!-- Section Dernière collecte -->
        <div class="section">
            <h3>📈 Dernière collecte</h3>
            <div id="collectStatus"></div>
        </div>

        <div id="notification" class="notification hidden"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
